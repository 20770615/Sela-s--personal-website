<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sela Rao | Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Manrope:wght@400;500;700;800&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="introScreen" class="intro-screen">
      <div class="intro-content">
        <p class="intro-kicker">Portfolio Stage</p>
        <h1>Open the Curtain</h1>
        <button id="openCurtainBtn" class="open-curtain-btn" type="button">Open the Curtain</button>
      </div>
    </div>

    <div class="curtain" aria-hidden="true">
      <div class="curtain-panel left"></div>
      <div class="curtain-panel right"></div>
      <div class="curtain-tie left"></div>
      <div class="curtain-tie right"></div>
    </div>

    <header class="site-header">
      <div class="header-left">
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">☀</button>
        <span id="themeHint" class="theme-hint">可在这里修改颜色模式</span>
        <div class="brand">Sela Rao</div>
      </div>
      <button id="langToggle" class="lang-toggle" type="button">EN</button>
    </header>

    <main id="app"></main>

    <div id="detailModal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal-content">
        <button id="closeModal" class="close-btn" type="button">×</button>
        <div id="modalBody"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
